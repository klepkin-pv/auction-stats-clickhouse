services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.11
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: auction
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickpass
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickpass
      REDIS_HOST: redis
    depends_on:
      - clickhouse
      - redis

volumes:
  clickhouse_data:
